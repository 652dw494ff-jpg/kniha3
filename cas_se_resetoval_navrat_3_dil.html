<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ČAS SE RESETOVAL: NÁVRAT</title><style>
body{margin:0;background:#090b10;color:#eee;font-family:system-ui;padding:20px}main{max-width:850px;margin:auto}h1{text-align:center}.sub{text-align:center;color:#aaa}.panel{background:#151a24;border:1px solid #303747;border-radius:20px;padding:25px;margin-top:20px}.c{display:none}.c.on{display:block}p{font-size:18px;line-height:1.8}.q{border-left:4px solid #8eacff;background:#0d121b;padding:12px 16px;margin:18px 0;font-weight:bold;border-radius:0 10px 10px 0}.buttons{text-align:center;margin:15px}.buttons button,select{background:#202838;color:white;border:1px solid #394357;border-radius:10px;padding:10px;margin:4px}.nav{display:flex;gap:10px}.nav button{flex:1}.end{text-align:center;font-size:23px;font-weight:bold;margin-top:30px}@media(max-width:600px){body{padding:10px}.panel{padding:16px}p{font-size:17px}.nav{flex-direction:column}}</style></head><body><main><h1>ČAS SE RESETOVAL</h1><div class="sub">NÁVRAT · 3. DÍL</div><div class="buttons"><button onclick="fs(-1)">A−</button><button onclick="fs(1)">A+</button><button onclick="document.body.classList.toggle('light')">🌙 / ☀️</button><select id="s" onchange="show(this.value)"></select></div><div class="panel" id="book"></div><p id="pr" style="text-align:center;color:#999"></p></main><script>
const a=[
["Kapitola 1 — TENTOKRÁT JSTE SE NEVRÁTILI",`<p>„Tentokrát jste se nevrátili.“</p><p>Hlas zmizel. Patrik stál ve tmě a snažil se rozeznat ostatní.</p><p>„Vojto?“ — „Jsem tady.“<br>„Adame?“ — „Jo.“<br>„Lukáši?“</p><p>Ticho.</p><p>„Lukáši?“</p><p>Ozvalo se pouze slabé: „Já… nevím, kde jsem.“</p><p>V místnosti se rozsvítilo malé světlo.</p><div class="q">Stáli tam jen tři. Patrik, Adam a Vojta.<br><br>Lukáš zmizel.</div>`],
["Kapitola 2 — 20:30",`<p>Na zdi se objevily digitální číslice.</p><div class="q">20:29 → 20:30</div><p>Patrik vytáhl telefon. Žádný signál. Žádný internet. Ani hodiny. Jen černá obrazovka.</p><p>„Tohle už není normální,“ řekl Adam.</p><p>Vojta ukázal na zeď.</p><div class="q">20:30 — 20:31 — 20:32</div><p>„Čas běží,“ řekl Patrik.</p><p>„Tak proč mám pocit, že jsme tu už byli?“</p><p>Na dveřích se objevilo:</p><div class="q">PATRIKU, NEOTEVÍREJ.</div>`],
["Kapitola 3 — LUKÁŠŮV HLAS",`<p>Z chodby se ozvalo:</p><div class="q">„Kluci… Pomozte mi.“</div><p>Lukáš.</p><p>Adam sáhl na kliku, ale Patrik ho zastavil.</p><p>„Počkej.“</p><p>Z druhé strany se ozvalo Patrikovým hlasem:</p><div class="q">„Patriku… Otevři.“</div><p>Vojta ustoupil.</p><div class="q">„Tak tohle už fakt nechci.“</div>`],
["Kapitola 4 — FOTOGRAFIE",`<p>Na podlaze se objevila fotografie. Byli na ní všichni čtyři před domem číslo 28.</p><p>Datum:</p><div class="q">14. 10. 2025</div><p>„To je před rokem,“ řekl Adam.</p><p>Na zadní straně bylo:</p><div class="q">NEBYL TADY SÁM.</div><p>„Tak s kým?“ zeptal se Vojta.</p><p>Za nimi se ozvalo:</p><div class="q">Tik.</div>`],
["Kapitola 5 — PÁTÉ MÍSTO",`<p>Na zdi se objevily čtyři obrysy. Patrik. Vojta. Adam. Lukáš.</p><p>A potom ještě jeden.</p><div class="q">Pátý.</div><p>„Tohle tam předtím nebylo,“ zašeptal Patrik.</p><div class="q">TEN PÁTÝ SI VÁS PAMATUJE.</div><p>Adam se otočil ke dveřím.</p><div class="q">„Někdo je venku.“</div>`],
["Kapitola 6 — VENKU",`<p>Dveře se samy otevřely. Za nimi nebyla ulice, ale les. Stejný les jako u opuštěného domu.</p><p>V dálce zahlédli školu.</p><div class="q">Základní škola Chvaltice.</div><p>Patrik vytáhl telefon. Tentokrát fungoval.</p><div class="q">7:31</div><p>Adam se usmál. „Takže jsme to zvládli.“</p><p>Patrik zavrtěl hlavou.</p><div class="q">14. 10. 2025</div>`],
["Kapitola 7 — PŘED ROKEM",`<p>Stáli před školou. Všichni studenti vypadali normálně. Nikdo z nich si jich nevšímal.</p><p>Na konci chodby Patrik uviděl Lukáše. Vypadal mladší. Vedle něj stál někdo další.</p><p>Patrik ho neznal.</p><p>Lukáš se otočil, uviděl Patrika a okamžitě zbledl.</p>`],
["Kapitola 8 — KDO JE TEN KLUK?",`<p>Lukáš přiběhl.</p><div class="q">„Co tady děláte?!“</div><p>„To bychom se měli ptát my tebe,“ řekl Adam.</p><p>Lukáš vypadal zmateně.</p><div class="q">„Vy… mě znáte?“</div><p>Patrikovi došlo, co se děje.</p><p>„Tohle je minulost.“</p><p>Lukáš ukázal na kluka za nimi.</p><div class="q">„On vás sem dostal.“</div><p>Všichni se otočili.</p><p>Kluka už tam nebylo.</p>`],
["Kapitola 9 — PÁTÝ",`<p>Na zemi ležel jeho sešit. Patrik ho zvedl.</p><div class="q">PATRIK — VOJTA — ADAM — LUKÁŠ<br><br>RÍŠA</div><p>Všichni ztichli.</p><p>„Ríša?“ řekl Vojta.</p><p>Patrikovi došlo, že to jméno už jednou slyšel.</p><p>Otočil stránku.</p><div class="q">RÍŠA VÍ, KDE TO ZAČALO.</div>`],
["Kapitola 10 — NÁVRAT",`<p>Zazvonil školní zvonek. Všechno se rozmazalo.</p><p>Patrik otevřel oči. Znovu stáli v místnosti domu číslo 28. Tentokrát byli všichni čtyři.</p><p>„Kolik je hodin?“</p><div class="q">20:28</div><p>Telefon zavibroval.</p><div class="q">UŽ VÍTE, KDY TO ZAČALO.<br><br>TEĎ ZJISTÍTE PROČ.<br><br>RÍŠA ČEKÁ.</div><p>Dveře se pomalu otevřely.</p><p>Za nimi někdo stál.</p><p>Postava udělala jeden krok dopředu.</p><div class="q">„Trvalo vám to.“</div><div class="end">KONEC 3. DÍLU<br><br>Pokračování příště… 👁️🕰️</div>`]
];
const b=document.getElementById("book"),s=document.getElementById("s");a.forEach((x,i)=>{s.innerHTML+=`<option value="${i}">${x[0]}</option>`;b.innerHTML+=`<section class="c${i?'':' on'}"><h2>${x[0]}</h2>${x[1]}<div class="nav"><button onclick="show(${Math.max(0,i-1)})">← Předchozí</button><button onclick="show(${Math.min(9,i+1)})">Další →</button></div></section>`});function show(i){i=+i;document.querySelectorAll(".c").forEach((x,n)=>x.classList.toggle("on",n==i));s.value=i;document.getElementById("pr").textContent=`Kapitola ${i+1} z 10`;scrollTo(0,0)}let z=18;function fs(n){z=Math.max(14,Math.min(25,z+n));document.querySelectorAll(".c p,.q").forEach(x=>x.style.fontSize=z+"px")}show(0);
</script></body></html>
